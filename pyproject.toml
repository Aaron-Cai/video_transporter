[project]
name = "video-transporter"
version = "0.1.0"
description = "YouTube channel downloader and monitoring service"
readme = "readme.md"
requires-python = ">=3.11"
dependencies = [
  "apscheduler>=3.10.4,<4",
  "fastapi>=0.116.0,<1",
  "pydantic-settings>=2.10.1,<3",
  "sqlalchemy>=2.0.43,<3",
  "uvicorn[standard]>=0.35.0,<1",
]

[dependency-groups]
dev = [
  "httpx>=0.28.1,<1",
  "pytest>=8.4.1,<9",
  "ruff>=0.13.0,<1",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
